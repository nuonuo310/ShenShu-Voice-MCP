name: Manual D1 Read-Only Preflight

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type READ_ONLY_D1 to confirm no database writes'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: manual-d1-readonly-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ inputs.confirmation == 'READ_ONLY_D1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SHENSHU_D1_READONLY_PREFLIGHT: '1'
      CF_D1_ACCOUNT_ID: ${{ secrets.CF_D1_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
      CF_D1_API_TOKEN: ${{ secrets.CF_D1_READONLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Require separately provisioned read-only credentials
        shell: bash
        run: |
          if [ -z "$CF_D1_ACCOUNT_ID" ] || [ -z "$CF_D1_DATABASE_ID" ] || [ -z "$CF_D1_API_TOKEN" ]; then
            echo 'preflight_not_configured'
            exit 2
          fi
      - name: Validate read-only entrypoint syntax
        run: |
          node --check src/d1-qualification-readonly-cli.js
          node --check src/d1-qualification-manual-readonly.js
      - name: Run read-only qualification
        run: npm run d1:preflight:readonly
