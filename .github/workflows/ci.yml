name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check server.js
      - run: node --check src/minimax-adapter.js
      - run: npm test
      - run: node test/smoke-server.mjs
