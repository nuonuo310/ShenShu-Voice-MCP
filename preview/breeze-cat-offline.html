<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>沈述 · 语音气泡</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#e9d8c3;background:transparent;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;padding:10px;background:transparent}
.shell{width:min(100%,420px)}
.sender{display:block;margin:0 0 8px 4px;font-size:11px;letter-spacing:.18em;color:#d8c0a4}
.bubble{display:flex;align-items:center;gap:12px;min-height:60px;padding:9px 13px;border:1px solid rgba(218,187,149,.27);border-radius:30px;background:linear-gradient(110deg,rgba(104,83,65,.44),rgba(58,48,42,.68) 65%,rgba(48,41,37,.78));box-shadow:0 8px 25px rgba(0,0,0,.12),inset 0 1px rgba(255,239,213,.06)}
#play{width:40px;height:40px;flex:0 0 40px;border:1px solid rgba(249,225,187,.45);border-radius:50%;background:linear-gradient(135deg,#e2c9a6,#8e775f);color:#fff1d8;display:grid;place-items:center;cursor:pointer}
#play[disabled]{opacity:.45;cursor:not-allowed}
#play.playing{background:linear-gradient(135deg,#fff0d7,#edc59f);color:#6d5039;box-shadow:0 0 14px rgba(244,203,154,.23)}
.glyph{display:block;width:0;height:0;margin-left:3px;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:11px solid currentColor}
#play.playing .glyph{width:12px;height:14px;margin:0;border:0;border-left:3px solid currentColor;border-right:3px solid currentColor}
.wave{height:36px;flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:2px}
.wave i{display:block;flex:1;max-width:4px;height:var(--h);border-radius:6px;background:rgba(207,184,161,.48);transition:background .12s}
.wave i.heard{background:#ffe0b6}
.duration{flex:0 0 auto;min-width:32px;text-align:right;font-size:12px;color:#e4d0bb;font-variant-numeric:tabular-nums}
.favorite{flex:0 0 24px;width:24px;height:36px;padding:3px;border:0;background:transparent;color:#d8c2a5;display:grid;place-items:center;opacity:.45}
.favorite svg{width:21px;height:21px;overflow:visible}.favorite path{fill:transparent;stroke:currentColor;stroke-width:2.4;stroke-linejoin:round}
.status{min-height:16px;margin:8px 4px 0;font-size:11px;line-height:1.45;color:#bba893}
.text{margin:8px 4px 0;font-size:12px;line-height:1.55;color:#d7c5b2}
.direct04{padding:14px;margin-top:13px;border:1px solid rgba(218,187,149,.26);border-radius:16px;background:rgba(80,63,51,.23)}
.direct04 p{font-size:12px;line-height:1.65;margin:5px 0 10px}
.direct04 .direct04-exact{white-space:pre-wrap;overflow-wrap:anywhere;color:#f5e6d5}
#direct04-confirm{font:inherit;font-size:13px;padding:11px 14px;border-radius:12px;background:#d7b58e;color:#2a1b12;border:0}
#direct04-confirm:disabled{opacity:.52}
body.desktop04{color-scheme:light dark;color:#594a3f}
.desktop04 .shell{width:min(100%,460px)}
.desktop04 .sender{color:#816c5b;letter-spacing:.1em}
.desktop04 .text{color:#594a3f;font-size:13px}
.desktop04 .status{color:#756455;font-size:12px;line-height:1.6}
.desktop04 .direct04{background:#faf6f1;border:1px solid #e7ddd2;color:#594a3f}
.desktop04 .direct04 .direct04-exact{color:#493a30;font-size:14px}
.desktop04 #direct04-confirm{cursor:pointer;background:#85684f;color:#fffaf4}
.desktop04 #direct04-confirm:disabled{cursor:default}
.desktop04 #diagnostics,.desktop04 #oauth-ui-build,.desktop04 .favorite{display:none!important}
@media(prefers-color-scheme:dark){
 body.desktop04{color:#ecded0}
 .desktop04 .text,.desktop04 .sender{color:#e1cdb8}
 .desktop04 .status{color:#c4b19e}
 .desktop04 .direct04{background:#342d28;border-color:#605044;color:#ecded0}
 .desktop04 .direct04 .direct04-exact{color:#f6e8d9}
}
@media(max-width:360px){.bubble{gap:8px;padding-inline:10px}.wave{gap:1px}}
@media(prefers-reduced-motion:reduce){.wave i{transition:none}}
/* Approved silver concept: proportional recreation, not a raster screenshot. */
body.desktop04{color-scheme:light;color:#4a4c50;padding:24px 10px 10px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}
.desktop04 .shell{width:min(100%,460px)}
.desktop04 .sender{display:none}
.desktop04 .silver-player{position:relative;display:grid;grid-template-columns:80px minmax(0,1fr) 50px;gap:12px;align-items:center;min-height:122px;padding:12px;border:1px solid #bfc0c2;border-radius:23px;background:repeating-linear-gradient(90deg,transparent 0 3px,#a4a8ae18 3px 4px),linear-gradient(160deg,#fafafa,#ededee);box-shadow:0 3px 6px #262a301b,inset 0 0 0 4px #ffffff8c,inset 0 0 0 5px #dadbdd77}
.portrait{height:80px;border:3px solid #bfc1c4;border-radius:15px;background:linear-gradient(140deg,#ececed,#dadbdd);box-shadow:inset 0 2px 3px #ffffff,0 1px 2px #42464c22;overflow:hidden}.portrait img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 40%;border-radius:11px}
.silver-screen{min-width:0;height:96px;padding:10px 12px 9px;border:1px solid #d7d8da;border-radius:17px;background:#fdfdfd;box-shadow:inset 0 1px 3px #30333a0d,0 1px 0 #fff;display:flex;flex-direction:column;justify-content:space-between}
.screen-heading{display:flex;align-items:baseline;gap:10px;white-space:nowrap}.screen-heading strong{font-size:20px;font-weight:500;color:#34363a}.screen-heading small{font-size:9px;letter-spacing:.08em;color:#8c8f94}
.desktop04 .wave{height:24px;flex:0 0 24px;gap:2px}.desktop04 .wave i{max-width:3px;height:calc(var(--h) * .6);background:#a4afb9;transform-origin:center;transition:transform .1s}.desktop04 .wave i.heard{background:#8192a3}
.silver-player.is-playing .wave i{animation:voice-breathe .62s ease-in-out infinite alternate}.silver-player.is-playing .wave i:nth-child(3n){animation-delay:-.4s}.silver-player.is-playing .wave i:nth-child(3n + 1){animation-delay:-.2s}@keyframes voice-breathe{from{transform:scaleY(.55)}to{transform:scaleY(1)}}
.timeline{display:flex;align-items:center;gap:9px}.track{height:6px;border-radius:8px;background:#e0e1e3;flex:1;overflow:hidden}.track i{display:block;height:100%;width:0;background:#8493a2;border-radius:inherit}.desktop04 .duration{font-size:10px;color:#63666c;min-width:56px}
.silver-controls{display:flex;flex-direction:column;align-items:center;gap:4px}.desktop04 #play{width:46px;height:46px;flex:0 0 46px;border:1px solid #d0d1d3;color:#46484c;background:linear-gradient(145deg,#fff,#e9e9eb);box-shadow:inset 0 0 0 3px #ffffffa0,0 2px 3px #272a301a}.desktop04 #play.playing{color:#46484c;background:linear-gradient(145deg,#fdfdfd,#e9e9eb);box-shadow:inset 0 0 0 3px #ffffffa0,0 1px 2px #272a301a}.desktop04 #play:active{transform:translateY(1px)}
.desktop04 .favorite{display:grid!important;width:38px;height:38px;flex:0 0 38px;opacity:1;color:#bfc2c7;cursor:pointer}.desktop04 .favorite:disabled{opacity:.5;cursor:default}.desktop04 .favorite svg{width:21px;height:21px}.desktop04 .favorite path{stroke-width:1.3;fill:none}.desktop04 .favorite[aria-pressed=true]{color:#bb8994;filter:drop-shadow(0 0 2px #bb899433)}.desktop04 .favorite[aria-pressed=true] path{fill:#bb899444}
.kiss{position:absolute;right:16%;top:-12px;font-size:11px;color:#8b7c80;opacity:0;pointer-events:none;white-space:nowrap}.kiss span{font-size:22px;color:#bb8994;vertical-align:middle;margin-right:5px}.kiss.show{animation:kiss 2.5s ease-out both}@keyframes kiss{0%{opacity:0;transform:translateY(5px) scale(.9)}20%,75%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-3px)}}
.collection-toolbar{display:flex;align-items:center;gap:12px;margin:8px 4px;min-height:26px;font-size:11px;color:#777d84}.collection-toolbar button,#voice-gallery button{font:inherit;color:#686f78;background:transparent;border:1px solid #d9dce0;border-radius:9px;padding:5px 9px;cursor:pointer}button:focus-visible{outline:2px solid #8597ab;outline-offset:3px}.collection-toolbar button:disabled{opacity:.45;cursor:default}
#voice-gallery{margin-top:12px;border-top:1px solid #e2e3e5;padding:12px 4px;color:#4d535c;font-size:12px}#voice-gallery[hidden]{display:none}#voice-gallery header{display:flex;justify-content:space-between;align-items:center}#voice-gallery h2{font-size:15px;font-weight:500;margin:0}.gallery-note{font-size:11px;color:#8a8e96}.gallery-row{border-bottom:1px solid #eceef0;padding:10px 0}.gallery-row p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;margin:0 0 5px}.gallery-row small{color:#858a92;font-size:10px}.gallery-actions{display:flex;gap:8px;margin-top:7px}.desktop04 .text{font-size:12px;color:#666c75;white-space:pre-wrap}.desktop04 .status{color:#7d838b;font-size:11px}
@media(max-width:400px){.desktop04 .silver-player{grid-template-columns:64px minmax(0,1fr) 44px;gap:8px;padding:11px;min-height:114px;border-radius:21px}.portrait{height:72px}.silver-screen{height:90px;padding:9px;border-radius:15px}.screen-heading{gap:7px}.screen-heading strong{font-size:18px}.screen-heading small{font-size:8px;letter-spacing:0}.desktop04 #play{width:42px;height:42px;flex-basis:42px}.desktop04 .duration{font-size:9px;min-width:49px}.timeline{gap:5px}}
@media(prefers-reduced-motion:reduce){.silver-player .wave i,.kiss.show{animation:none}.kiss.show{opacity:1}}

/* Compact mist-blue chat bubble. Scoped exclusively to the Breeze resource. */
body.breeze-cat{color-scheme:light;color:#536e7e;padding:53px 14px 12px;background:transparent}
.breeze-cat .shell{width:min(100%,260px)}
.breeze-cat .breeze-cat-player{isolation:isolate;position:relative;display:flex;align-items:center;gap:9px;min-height:52px;padding:8px 15px 8px 14px;border:0;border-radius:19px;background:linear-gradient(180deg,#dce7ed 0%,#eff6fa 22%,#edf5fa 78%,#f8fcfe 100%);box-shadow:inset 0 2px 3px #8ca3b421,inset 0 -2px 1px #fff,0 4px 7px #516f8225;overflow:visible}
.breeze-cat-player:before{content:"";position:absolute;z-index:-1;left:5px;bottom:0;width:20px;height:19px;background:#f4f9fc;border-radius:0 0 18px 5px;transform:skew(-26deg);box-shadow:0 2px 1px #fff}
.breeze-cat .cat-companion{position:absolute;left:-12px;top:-37px;width:72px;height:67px;pointer-events:none}.cat-companion svg{display:block;width:100%;height:100%}
.cat-paws{position:absolute;right:11px;top:-20px;width:34px;height:22px;color:#8ba3b2;pointer-events:none}
.cat-yarn{position:absolute;right:5px;bottom:-4px;width:62px;height:25px;color:#728f9f;pointer-events:none}
.breeze-cat #play,.breeze-cat #play.playing{width:32px;height:36px;flex:0 0 32px;border:0;border-radius:8px;background:transparent;box-shadow:none;color:#53778b;padding:0;z-index:1}
.breeze-cat #play .glyph{border-top-width:9px;border-bottom-width:9px;border-left-width:15px;margin-left:2px}.breeze-cat #play.playing .glyph{width:13px;height:18px;border:0;border-left:4px solid currentColor;border-right:4px solid currentColor;margin:0}
.breeze-cat #play:disabled{opacity:.4}.breeze-cat #play:active{transform:scale(.94)}
.breeze-cat .wave{height:24px;flex:1;gap:3px;min-width:0}.breeze-cat .wave i{height:calc(var(--h) * .7);max-width:4px;background:#89a6b6}.breeze-cat .wave i.heard{background:#55798f}
.breeze-cat .duration{min-width:36px;flex:0 0 auto;font-size:13px;color:#56798c;font-weight:400}
.breeze-cat .cat-toolbar{display:grid;grid-template-columns:auto 1fr 36px;align-items:center;gap:7px;margin:7px 3px 0;min-height:36px;color:#6b8493}
.breeze-cat #gallery-open{border:0;padding:5px 0;color:#637f90;font-size:12px;background:transparent}
.breeze-cat #favorite-status{font-size:10px;line-height:1.4;overflow-wrap:anywhere}
.breeze-cat .cat-toolbar #favorite{width:36px;height:36px;padding:3px;border:0;border-radius:0;background:transparent;box-shadow:none;color:#8da3b1}.breeze-cat .favorite svg{width:23px;height:23px}.breeze-cat .favorite path{stroke-width:1.7}
.breeze-cat .cat-toolbar #favorite[aria-pressed=true]{color:#6c90a7;filter:none}.breeze-cat .cat-toolbar #favorite[aria-pressed=true] path{fill:#adc9db88}
.breeze-cat .text{font-size:12px;color:#5d7482}.breeze-cat .status{font-size:11px;color:#738998}
.breeze-cat .breeze-progress,.breeze-cat #kiss{display:none!important}
.breeze-cat #voice-gallery{color:#536e7e;border-color:#e2ebf0}.breeze-cat #voice-gallery button{color:#637f90;border-color:#dbe5eb}
.breeze-cat button:focus-visible{outline:2px solid #648aa2;outline-offset:3px}
@media(max-width:300px){.breeze-cat .breeze-cat-player{gap:8px;padding-inline:15px}.breeze-cat .wave{gap:3px}.breeze-cat .duration{font-size:13px;min-width:32px}}
@media(prefers-reduced-motion:reduce){.breeze-cat .wave i{animation:none!important;transition:none}}

</style>
</head>

// Polling only reads an existing task; it never submits another synthesis.
let breezeActiveId=null,breezePollEpoch=0;
async function breezePending(result){
 const job=result?.structuredContent;if(!/^voice_[a-f0-9]{32}$/.test(job?.id??''))return;

 try{

  // payload. Read the original result once; never enqueue or synthesize again.
  if(job.state==='ready'&&!result?._meta?.shenshuPrivateAudio?.record){
   result=await request('tools/call',{name:'poll_shenshu_local_breeze',arguments:{id:job.id}});
   if(result?.isError||result?.structuredContent?.id!==job.id)throw Error();
  }
  while(epoch===breezePollEpoch&&Date.now()<deadline){
   const state=result?.structuredContent?.state;
   if(state==='ready'){
    const next=result?._meta?.shenshuPrivateAudio?.record;
    validateGeneratedBridgeRecord(next);applyResponse({structuredContent:{record:next}});
    desktopCollection.receive(next,result?._meta?.shenshuCollection);
    $('status').textContent='本地声音已准备好，点击播放。';return;
   }
   if(['failed','unknown','expired'].includes(state)){$('status').textContent='本地生成未完成；没有切换到 MiniMax，也不会自动重新生成。';return;}
   $('status').textContent=state==='claimed'?'电脑正在生成本地声音，请稍等…':'正在等待本地电脑领取任务…';
   await new Promise(resolve=>setTimeout(resolve,2000));
   result=await request('tools/call',{name:'poll_shenshu_local_breeze',arguments:{id:job.id}});
   if(result?.isError||result?.structuredContent?.id!==job.id)throw Error();
  }
  if(epoch===breezePollEpoch)$('status').textContent='等待已停止，可稍后读取原任务；不会自动重新生成。';
 }catch{$('status').textContent='暂时无法读取本地声音任务；没有重新生成或调用 MiniMax。';}
 finally{if(epoch===breezePollEpoch)breezeActiveId=null;}
}
