<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>沈述语音 · 独立预览</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#e9d8c3;background:#1c1917}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 78% 20%,#302821 0%,#1c1917 60%)}main{width:min(100%,410px)}.caption{color:#b2a394;font-size:12px;line-height:1.7}.sender{font-size:11px;letter-spacing:.18em;margin:0 0 9px 5px}.bubble{display:flex;align-items:center;gap:12px;min-height:60px;padding:9px 13px;border:1px solid rgba(218,187,149,.27);border-radius:30px;background:linear-gradient(110deg,rgba(104,83,65,.44),rgba(58,48,42,.68) 65%,rgba(48,41,37,.78))}button{cursor:pointer}#play{border:1px solid rgba(249,225,187,.45);border-radius:50%;width:40px;height:40px;flex:0 0 40px;background:linear-gradient(135deg,#e2c9a6,#8e775f);color:#38271d}#play:disabled{opacity:.4;cursor:not-allowed}.wave{display:flex;align-items:center;gap:2px;flex:1;min-width:0;height:36px}.wave i{flex:1;height:var(--h);max-width:4px;border-radius:6px;background:#907b69}.wave i.heard{background:#ffe0b6}.duration{font-size:12px;white-space:nowrap}.favorite{border:0;background:transparent;color:#d8c2a5;font-size:21px}.favorite:disabled{opacity:.4}.status{font-size:12px;color:#cebca6;margin-top:16px}
</style></head><body><main><p class="caption">沈述语音 · 聊天气泡离线预览</p><div class="sender">SHEN</div><div class="bubble"><button id="play" aria-label="播放" disabled>▶</button><div class="wave" id="wave"></div><span class="duration" id="duration">0:00</span><button class="favorite" aria-label="收藏（尚未接入）" disabled>✧</button></div><p class="status" id="status">展示模式：尚未接入 MCP 音频；不发送网络请求，不扣 MiniMax 额度。</p><p class="caption">沿用声音馆 bubble 的造型方向。正式接入时由 MCP 工具结果提供临时音频，不从浏览器读取凭证。</p></main><script>
const w=document.getElementById('wave');for(let i=0;i<32;i++){const b=document.createElement('i');b.style.setProperty('--h',9+26*Math.abs(Math.sin(i*1.81)*Math.cos(i*.4))+'px');w.appendChild(b)}
</script></body></html>
