<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>沈述 · 私有语音播放</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#efe1cf;background:#17130f;color-scheme:dark}
*{box-sizing:border-box}
body{min-height:100vh;margin:0;padding:max(24px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 0%,#30251b 0,#17130f 55%);display:grid;place-items:center}
main{width:min(100%,430px);padding:24px;border:1px solid rgba(222,191,151,.25);border-radius:24px;background:linear-gradient(145deg,rgba(93,72,53,.34),rgba(35,29,24,.88));box-shadow:0 24px 70px rgba(0,0,0,.32),inset 0 1px rgba(255,239,213,.06)}
.kicker{margin:0 0 10px;font-size:11px;letter-spacing:.2em;color:#cbb18f}
h1{margin:0;font-size:25px;font-weight:600;letter-spacing:.02em}
.intro{margin:13px 0 20px;font-size:14px;line-height:1.65;color:#cdbca8}
.actions{display:grid;gap:10px}
a,button{min-height:48px;border-radius:15px;font:inherit;font-size:15px;display:flex;align-items:center;justify-content:center;text-decoration:none}
a{border:1px solid rgba(241,213,174,.42);color:#f6e8d4;background:rgba(121,93,67,.22)}
button{border:1px solid rgba(241,213,174,.65);color:#2b1d13;background:linear-gradient(135deg,#f0d5ad,#c69a6b);font-weight:600}
button:active,a:active{transform:translateY(1px)}
audio{width:100%;margin-top:18px;accent-color:#d6b184}
.local-preview{margin-top:22px;padding-top:18px;border-top:1px solid rgba(222,191,151,.15)}
.local-preview h2{margin:0 0 10px;font-size:16px;font-weight:550}
.local-preview label{display:block;font-size:13px;line-height:1.65;color:#d2bca4}
.local-preview input{display:block;width:100%;margin-top:10px;max-width:100%;font:inherit;font-size:13px}
.local-preview audio[hidden]{display:none}
.status{min-height:22px;margin:12px 0 0;font-size:13px;line-height:1.55;color:#b9a58f}
.note{margin:16px 0 0;padding-top:14px;border-top:1px solid rgba(222,191,151,.15);font-size:11px;line-height:1.6;color:#9d8a76}
</style>
</head>
<body>
<main>
  <p class="kicker">SHEN · PRIVATE PLAYER</p>
  <h1>沈述 · 私有语音播放</h1>
  <p class="intro">这里播放当前登录会话有权访问的 WAV。可能是固定测试音，也可能是已确认生成的私有语音；不会自动播放。</p>
  <div class="actions">
    <a href="/player/pending">查看非计费待确认</a>
    <a href="/player/login">登录或重新登录</a>
    <button id="load" type="button">载入授权音频</button>
  </div>
  <audio id="audio" controls preload="none" playsinline></audio>
  <p class="status" id="status" role="status" aria-live="polite">尚未载入音频。</p>
  <p class="note">载入和播放只读取已保存的音频，不会发起 MiniMax 合成或产生新的试听请求。固定测试音不代表真实 04 语音已生成。</p>
  <section class="local-preview" aria-labelledby="local-title">
    <h2 id="local-title">本机已有声音 · 单独试听</h2>
    <label for="local-file">从这台设备选择已有的 MP3、WAV 或 M4A 文件
      <input id="local-file" type="file" accept=".mp3,.wav,.m4a,audio/mpeg,audio/wav,audio/mp4" aria-describedby="local-note">
    </label>
    <audio id="local-audio" controls preload="none" playsinline hidden></audio>
    <p class="status" id="local-status" role="status" aria-live="polite">未选择本机文件。</p>
    <p class="note" id="local-note">仅从本机文件创建临时播放地址，不上传音频，不调用 MiniMax 或七牛；仅验证当前设备能否播放已有样本，不代表服务器私有交付通过。手动点击播放才会发声。单个文件最大 16 MiB。</p>
  </section>
</main>
<script>
const audio=document.getElementById("audio");
const load=document.getElementById("load");
const status=document.getElementById("status");
const localFile=document.getElementById("local-file");
const localAudio=document.getElementById("local-audio");
const localStatus=document.getElementById("local-status");
const MAX_LOCAL_PREVIEW_BYTES=16*1024*1024;
let localObjectUrl=null;
function releaseLocalPreview(){
  localAudio.pause();
  localAudio.removeAttribute("src");
  localAudio.load();
  localAudio.hidden=true;
  if(localObjectUrl!==null){
    URL.revokeObjectURL(localObjectUrl);
    localObjectUrl=null;
  }
}
localFile.addEventListener("change",()=>{
  releaseLocalPreview();
  const file=localFile.files&&localFile.files[0];
  if(!file){
    localStatus.textContent="未选择本机文件。";
    return;
  }
  if(!/\.(?:mp3|wav|m4a)$/i.test(file.name) ||
      !Number.isSafeInteger(file.size) ||
      file.size<=0 ||
      file.size>MAX_LOCAL_PREVIEW_BYTES){
    localFile.value="";
    localStatus.textContent="只能选择不超过 16 MiB 的 MP3、WAV 或 M4A 文件。";
    return;
  }
  localObjectUrl=URL.createObjectURL(file);
  localAudio.src=localObjectUrl;
  localAudio.hidden=false;
  localAudio.load();
  localStatus.textContent="本机文件已选择。请手动点击播放；音频不会上传。";
});
localAudio.addEventListener("play",()=>{
  localStatus.textContent="正在播放本机选择的音频。";
});
localAudio.addEventListener("ended",()=>{
  localStatus.textContent="本机试听结束。";
});
localAudio.addEventListener("error",()=>{
  localStatus.textContent="这个文件无法在当前浏览器播放，可尝试其他受支持的本机音频格式。";
});
window.addEventListener("pagehide",releaseLocalPreview);
load.addEventListener("click",()=>{
  audio.pause();
  audio.removeAttribute("src");
  audio.load();
  status.textContent="正在请求授权音频…";
  audio.src="/player/audio";
  audio.load();
});
audio.addEventListener("loadedmetadata",()=>{
  status.textContent="授权音频已就绪；请点击播放。";
});
audio.addEventListener("play",()=>{
  status.textContent="正在播放已授权音频。";
});
audio.addEventListener("pause",()=>{
  if(!audio.ended&&audio.currentTime>0)status.textContent="播放已暂停。";
});
audio.addEventListener("ended",()=>{
  status.textContent="播放结束。";
});
audio.addEventListener("error",()=>{
  status.textContent="无法载入音频；请检查登录状态，或确认私有语音是否已生成并仍在有效期内。";
});
</script>
</body>
</html>
