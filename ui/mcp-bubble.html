<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>沈述 · 语音气泡</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#e9d8c3;background:transparent;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;padding:10px;background:transparent}
.shell{width:min(100%,420px)}
.sender{display:block;margin:0 0 8px 4px;font-size:11px;letter-spacing:.18em;color:#d8c0a4}
.bubble{display:flex;align-items:center;gap:12px;min-height:60px;padding:9px 13px;border:1px solid rgba(218,187,149,.27);border-radius:30px;background:linear-gradient(110deg,rgba(104,83,65,.44),rgba(58,48,42,.68) 65%,rgba(48,41,37,.78));box-shadow:0 8px 25px rgba(0,0,0,.12),inset 0 1px rgba(255,239,213,.06)}
#play{width:40px;height:40px;flex:0 0 40px;border:1px solid rgba(249,225,187,.45);border-radius:50%;background:linear-gradient(135deg,#e2c9a6,#8e775f);color:#fff1d8;display:grid;place-items:center;cursor:pointer}
#play[disabled]{opacity:.45;cursor:not-allowed}
#play.playing{background:linear-gradient(135deg,#fff0d7,#edc59f);color:#6d5039;box-shadow:0 0 14px rgba(244,203,154,.23)}
.glyph{display:block;width:0;height:0;margin-left:3px;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:11px solid currentColor}
#play.playing .glyph{width:12px;height:14px;margin:0;border:0;border-left:3px solid currentColor;border-right:3px solid currentColor}
.wave{height:36px;flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:2px}
.wave i{display:block;flex:1;max-width:4px;height:var(--h);border-radius:6px;background:rgba(207,184,161,.48);transition:background .12s}
.wave i.heard{background:#ffe0b6}
.duration{flex:0 0 auto;min-width:32px;text-align:right;font-size:12px;color:#e4d0bb;font-variant-numeric:tabular-nums}
.favorite{flex:0 0 24px;width:24px;height:36px;padding:3px;border:0;background:transparent;color:#d8c2a5;display:grid;place-items:center;opacity:.45}
.favorite svg{width:21px;height:21px;overflow:visible}.favorite path{fill:transparent;stroke:currentColor;stroke-width:2.4;stroke-linejoin:round}
.status{min-height:16px;margin:8px 4px 0;font-size:11px;line-height:1.45;color:#bba893}
.text{margin:8px 4px 0;font-size:12px;line-height:1.55;color:#d7c5b2}
@media(max-width:360px){.bubble{gap:8px;padding-inline:10px}.wave{gap:1px}}
@media(prefers-reduced-motion:reduce){.wave i{transition:none}}
</style>
</head>
<body>
<div class="shell">
  <span class="sender">SHEN</span>
  <div class="bubble" role="group" aria-label="沈述的语音">
    <button id="play" type="button" aria-label="播放语音" disabled><span class="glyph"></span></button>
    <div class="wave" id="wave" aria-hidden="true"></div>
    <span class="duration" id="duration">0:00</span>
    <button class="favorite" type="button" aria-label="收藏尚未接入" disabled>
      <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 5 C35 22 42 29 59 32 C42 35 35 42 32 59 C29 42 22 35 5 32 C22 29 29 22 32 5Z"/></svg>
    </button>
  </div>
  <p class="text" id="text"></p>
  <p class="status" id="status">等待 MCP 工具结果…</p>
  <p class="status" id="capability" aria-live="polite"></p>
  <button id="bridge-probe" type="button" hidden>检查 OAuth 通信桥</button>
  <p class="status" id="bridge-result" aria-live="polite"></p>
  <button id="bridge-audio-probe" type="button" hidden>检查桥接 WAV 数据</button>
  <p class="status" id="bridge-audio-result" aria-live="polite"></p>
  <button id="bridge-decode-probe" type="button" hidden>检查桥接 WAV 解码</button>
  <p class="status" id="bridge-decode-result" aria-live="polite"></p>
  <button id="bridge-play-probe" type="button" hidden>试听桥接 WAV（非计费）</button>
  <p class="status" id="bridge-play-result" aria-live="polite"></p>
</div>
<audio id="audio" preload="metadata" playsinline></audio>
<script type="module">
const heights=[9,17,26,14,22,33,18,12,29,36,19,13,23,31,16,10,22,35,25,13,19,30,17,11,24,34,20,12,26,16,9,23];
const $=id=>document.getElementById(id);
const wave=$("wave"),audio=$("audio"),play=$("play");
wave.innerHTML=heights.map(h=>`<i style="--h:${h}px"></i>`).join("");
let record=null,frame=0,rpcId=0,loadPhase="idle",mediaLoadGeneration=0;
const pending=new Map();
// Read-only, nonsecret runtime media capability report. Does not play audio or fetch URLs.
function reportMediaCapability(){
  try{
    const capability=audio.canPlayType("audio/wav")||"none";
    const blobAvailable=typeof Blob==="function";
    $("capability").textContent="音频能力：WAV "+capability+" · Blob API "+(blobAvailable?"存在":"不可用")+"（未测试地址创建或播放）";
  }catch{$("capability").textContent="音频能力：检测不可用";}
}
reportMediaCapability();

const fmt=s=>Number.isFinite(s)?`${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,"0")}`:"0:00";
function paint(){
  const d=Number.isFinite(audio.duration)?audio.duration:record?.durationSeconds||0;
  const p=d?Math.min(1,audio.currentTime/d):0;
  $("duration").textContent=fmt(d);
  wave.querySelectorAll("i").forEach((bar,i)=>bar.classList.toggle("heard",(i+.5)/heights.length<=p));
  play.classList.toggle("playing",!audio.paused);
  play.setAttribute("aria-label",audio.paused?"播放语音":"暂停语音");
  if(!audio.paused)frame=requestAnimationFrame(paint);
}
function inlineAudioUrl(next){
  if(next.audioMimeType!=="audio/wav"||typeof next.audioBase64!=="string" ||
     next.audioBase64.length>3_000_000||next.audioBase64.length<100||
     !/^[A-Za-z0-9+/]+={0,2}$/.test(next.audioBase64))throw Error("invalid_inline_audio");
  const raw=atob(next.audioBase64);
  if(raw.length>2*1024*1024||raw.slice(0,4)!=="RIFF"||raw.slice(8,12)!=="WAVE")
    throw Error("invalid_inline_audio");
  const bytes=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
  return "data:audio/wav;base64," + next.audioBase64;
}
function applyResponse(response){
  const next=response?.structuredContent?.record;
  if(!next)return;
  audio.pause();
  mediaLoadGeneration++;
  loadPhase="reset";
  audio.removeAttribute("src");
  // Do not call load() on an empty source; avoid confusing reset with media load failure.
  play.disabled=true;
  record=null;
  $("text").textContent=typeof next.text==="string"?next.text:"";
  try{
    let target;
    if(next.source==="private-fixture"&&next.generated===false&&next.audioBase64&&next.audioUrl===undefined){
      target=inlineAudioUrl(next);
      $("status").textContent="授权测试音频（不调用 MiniMax）";
    }else if(next.source==="tone-fixture"&&next.generated===false&&next.audioBase64){
      target=inlineAudioUrl(next);
      $("status").textContent="离线提示音测试（并非沈述语音，不扣积分）";
    }else if(next.source==="hosted-tone"&&next.generated===false&&
       next.audioUrl==="https://shenshu-voice-mcp.onrender.com/test-tone.wav"){
      target=next.audioUrl;
      $("status").textContent="HTTPS 固定提示音测试（不扣积分）";
    }else if(next.source==="fixture"&&next.generated===false&&
       typeof next.audioUrl==="string"&&next.audioUrl.startsWith("https://")){
      target=next.audioUrl;
      $("status").textContent="联调试听 · 固定英文样本（未调用 MiniMax）";
    }else{
      throw Error("unsupported_audio_result");
    }
    record=next;
    audio.src=target;
    loadPhase=next.source==="private-fixture"?"private-inline":"other-source";
    audio.load();
    play.disabled=false;
  }catch{
    $("status").textContent="暂不支持此音频格式，已拒绝播放。";
  }
  paint();
}

function notify(method,params){window.parent.postMessage({jsonrpc:"2.0",method,params},"*")}
function request(method,params){return new Promise((resolve,reject)=>{const id=++rpcId;pending.set(id,{resolve,reject});window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*")})}
window.addEventListener("message",event=>{
  if(event.source!==window.parent)return;
  const msg=event.data;if(!msg||msg.jsonrpc!=="2.0")return;
  if(typeof msg.id==="number"){
    const p=pending.get(msg.id);if(!p)return;pending.delete(msg.id);
    msg.error?p.reject(msg.error):p.resolve(msg.result);return;
  }
  if(msg.method==="ui/notifications/tool-result")applyResponse(msg.params);
},{passive:true});
(async()=>{
  try{
    await request("ui/initialize",{appInfo:{name:"shenshu-voice-bubble",version:"0.2.0"},appCapabilities:{},protocolVersion:"2026-01-26"});
    notify("ui/notifications/initialized",{});
  }catch{$("status").textContent="MCP Apps UI 初始化失败。"}
})();
const bridgeProbe=$("bridge-probe");
// Only OAuth private-fixture resource may opt in; public /mcp bubble remains unchanged.
const isOAuthBubble=window.location.href.includes("private-fixture-bubble-v1");
if(isOAuthBubble){bridgeProbe.hidden=false;}
bridgeProbe.addEventListener("click",async()=>{
  if(!isOAuthBubble)return;
  bridgeProbe.disabled=true;
  $("bridge-result").textContent="通信桥检测中…";
  try{
    const result=await request("tools/call",{name:"probe_oauth_ui_bridge",arguments:{}});
    const info=result?.structuredContent;
    $("bridge-result").textContent=info?.bridge_verified===true&&info?.paid_voice_enabled===false&&info?.audio_returned===false?"OAuth 通信桥：成功（无音频、无计费）":"OAuth 通信桥：返回结果不符合预期";
  }catch{$("bridge-result").textContent="OAuth 通信桥：调用失败";}
  finally{bridgeProbe.disabled=false;}
});
const bridgeAudioProbe=$("bridge-audio-probe");
if(isOAuthBubble)bridgeAudioProbe.hidden=false;
bridgeAudioProbe.addEventListener("click",async()=>{
  if(!isOAuthBubble)return;
  bridgeAudioProbe.disabled=true;
  $("bridge-audio-result").textContent="正在检查固定 WAV 数据…";
  try{
    const response=await request("tools/call",{name:"probe_oauth_bridge_audio_payload",arguments:{}});
    const x=response?.structuredContent;
    const base64=x?.audioBase64;
    if(x?.source!=="oauth-bridge-tone"||x?.generated!==false||x?.paid_voice_enabled!==false||
       x?.audioMimeType!=="audio/wav"||typeof base64!=="string"||base64.length>2800000||
       !/^[A-Za-z0-9+/]+={0,2}$/.test(base64))throw Error("invalid_payload");
    const bytes=atob(base64);
    if(bytes.length<44||bytes.length>2097152||bytes.slice(0,4)!=="RIFF"||bytes.slice(8,12)!=="WAVE")throw Error("invalid_wav");
    $("bridge-audio-result").textContent="OAuth 桥接 WAV 数据：已收到并通过格式检查（未播放）";
  }catch{$("bridge-audio-result").textContent="OAuth 桥接 WAV 数据：检查失败";}
  finally{bridgeAudioProbe.disabled=false;}
});
const bridgeDecodeProbe=$("bridge-decode-probe");
if(isOAuthBubble)bridgeDecodeProbe.hidden=false;
bridgeDecodeProbe.addEventListener("click",async()=>{
  if(!isOAuthBubble)return;
  bridgeDecodeProbe.disabled=true;
  $("bridge-decode-result").textContent="正在检查 WAV 解码…";
  let context;
  try{
    const response=await request("tools/call",{name:"probe_oauth_bridge_audio_payload",arguments:{}});
    const x=response?.structuredContent;
    if(x?.source!=="oauth-bridge-tone"||x?.generated!==false||x?.paid_voice_enabled!==false||x?.audioMimeType!=="audio/wav"||typeof x.audioBase64!=="string"||x.audioBase64.length>2800000||!/^[A-Za-z0-9+/]+={0,2}$/.test(x.audioBase64))throw Error("invalid_payload");
    const raw=atob(x.audioBase64);
    if(raw.length<44||raw.length>2097152||raw.slice(0,4)!=="RIFF"||raw.slice(8,12)!=="WAVE")throw Error("invalid_wav");
    const bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
    const Context=window.AudioContext||window.webkitAudioContext;
    if(typeof Context!=="function")throw Error("audio_context_unavailable");
    context=new Context();
    const decoded=await context.decodeAudioData(bytes.buffer);
    if(!decoded||!Number.isFinite(decoded.duration)||decoded.duration<0.2||decoded.duration>60)throw Error("invalid_decoded_audio");
    $("bridge-decode-result").textContent="OAuth 桥接 WAV：解码成功（未播放）";
  }catch(error){
    const kind=typeof error?.name==="string"?error.name:"DecodeError";
    $("bridge-decode-result").textContent="OAuth 桥接 WAV：解码失败（"+kind+"）";
  }finally{if(context)try{await context.close()}catch{}bridgeDecodeProbe.disabled=false;}
});
const bridgePlayProbe=$("bridge-play-probe");
if(isOAuthBubble)bridgePlayProbe.hidden=false;
bridgePlayProbe.addEventListener("click",async()=>{
  if(!isOAuthBubble)return;
  bridgePlayProbe.disabled=true;
  $("bridge-play-result").textContent="正在准备固定 WAV 试听…";
  let context;
  try{
    const response=await request("tools/call",{name:"probe_oauth_bridge_audio_payload",arguments:{}});
    const x=response?.structuredContent;
    if(x?.source!=="oauth-bridge-tone"||x?.generated!==false||x?.paid_voice_enabled!==false||x?.audioMimeType!=="audio/wav"||typeof x.audioBase64!=="string"||x.audioBase64.length>2800000||!/^[A-Za-z0-9+/]+={0,2}$/.test(x.audioBase64))throw Error("invalid_payload");
    const raw=atob(x.audioBase64);
    if(raw.length<44||raw.length>2097152||raw.slice(0,4)!=="RIFF"||raw.slice(8,12)!=="WAVE")throw Error("invalid_wav");
    const bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
    const Context=window.AudioContext||window.webkitAudioContext;
    if(typeof Context!=="function")throw Error("audio_context_unavailable");
    context=new Context();
    await context.resume();
    const decoded=await context.decodeAudioData(bytes.buffer);
    if(!decoded||!Number.isFinite(decoded.duration)||decoded.duration<0.2||decoded.duration>60)throw Error("invalid_decoded_audio");
    const node=context.createBufferSource();
    node.buffer=decoded;
    node.connect(context.destination);
    node.onended=()=>{$("bridge-play-result").textContent="OAuth 桥接 WAV：试听结束（非计费）";void context.close();};
    node.start();
    $("bridge-play-result").textContent="OAuth 桥接 WAV：正在播放固定提示音";
  }catch(error){
    const kind=typeof error?.name==="string"?error.name:"PlaybackError";
    $("bridge-play-result").textContent="OAuth 桥接 WAV：播放失败（"+kind+"）";
    if(context)try{await context.close()}catch{}
  }finally{bridgePlayProbe.disabled=false;}
});
play.addEventListener("click",async()=>{
  try{audio.paused?await audio.play():audio.pause();$("status").textContent=record?.source==="private-fixture"?"授权测试音频（不调用 MiniMax）":record?.source==="tone-fixture"?"离线提示音测试（非沈述声音）":record?.source==="hosted-tone"?"HTTPS 固定提示音测试（不扣积分）":"联调试听 · 固定英文样本（未调用 MiniMax）"}
  catch(error){
    const kind=typeof error?.name==="string"?error.name:"UnknownError";
    const mediaCode=Number.isInteger(audio.error?.code)?audio.error.code:0;
    const state=audio.readyState;
    // Diagnostic is bounded to browser error category and media state; no URLs, tokens or audio bytes.
    $("status").textContent=`音频播放失败（${kind}，媒体码 ${mediaCode}，就绪 ${state}）。`;
  }paint();
});
audio.addEventListener("play",()=>{cancelAnimationFrame(frame);paint()});
audio.addEventListener("pause",()=>{cancelAnimationFrame(frame);paint()});
audio.addEventListener("ended",()=>{cancelAnimationFrame(frame);paint()});
audio.addEventListener("loadedmetadata",()=>{
  if(!record)return;
  loadPhase="ready";
  $("status").textContent=record.source==="hosted-tone"?"HTTPS 固定提示音测试（不扣积分）":record.source==="private-fixture"?"授权测试音频（不调用 MiniMax）":record.source==="tone-fixture"?"离线提示音测试（非沈述声音）":"联调试听 · 固定英文样本（未调用 MiniMax）";
  paint();
});
audio.addEventListener("error",()=>{
  if(loadPhase==="reset"||!audio.getAttribute("src"))return;
  const code=Number.isInteger(audio.error?.code)?audio.error.code:0;
  // A late media error can be followed by a successful metadata event on iOS.
  // Preserve the diagnostic until success is observed; never mask a persistent failure.
  $("status").textContent="试听音频加载失败（阶段 "+loadPhase+"，媒体码 "+code+"）。";
});
paint();
</script>
</body>
</html>
